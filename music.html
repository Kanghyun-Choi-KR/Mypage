<!DOCTYPE HTML>
<html>
  <head>
    <title>My LP Collection</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/custom.css" />
    <style>

    body.page-music #main h2{
      font-family: "Pretendard", "Source Sans Pro", sans-serif !important;
    }

    body.page-music #lpList h2{
      font-size: 2.5em !important;
      font-family: "Pretendard", "Source Sans Pro", sans-serif !important;
    }
    
    body.page-music #wrapper{
      display: flex !important;
      align-items: stretch;
    }

    body.page-music #main{
      flex: 1 1 auto;
      min-width: 0; /* flex overflow 방지에 중요 */
    }

    body.page-music #sidebar{
      flex: 0 0 300px;   /* 사이드바 폭 */
      width: 300px;      /* 안전장치 */
    }

    body.page-music .banner{
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
      margin: 0 0 3rem 0;
    }

    /* 글 영역 */
    body.page-music .banner .content{
      flex: 1 1 auto;
      min-width: 0;
    }

    /* 이미지 영역 */
    body.page-music .banner .image.object{
      flex: 0 0 320px;   /* 원하는 이미지 칸 폭 */
      width: 320px;
      margin: 0;
      float: none !important;     /* 혹시 남아있는 float 무력화 */
    }

    /* 이미지 자체 */
    body.page-music .banner .image.object img{
      display: block;
      width: 100%;
      height: auto;
      max-width: none !important; /* 기존 max-width 충돌 방지 */
      margin: 0 !important;       /* 가운데 정렬 제거 */
      border-radius: 10px;
    }

    body.page-music .banner + .banner {
        border-top: 1px solid #ddd;
        padding-top: 3rem;
        margin-top: 3rem;
    }

    /* 모바일에서는 세로로(이미지 위/아래) */
    @media (max-width: 736px){
      body.page-music .banner{
        flex-direction: column;
      }
      body.page-music .banner .image.object{
        width: 100%;
        flex-basis: auto;
      }
      body.page-music .banner .image.object img{
        width: 100%;
      }
    }


    body.page-music .album-title {
      font-size: clamp(1rem, 1.8vw, 1.6rem);
      font-weight: 700;
      line-height: 1.2;

      white-space: nowrap;       /* 기본은 한 줄 */
      overflow: hidden;
      text-overflow: ellipsis;   /* ... */

      cursor: pointer;
    }

    body.page-music .album-title.is-open {
      white-space: normal;       /* 클릭하면 펼쳐짐 */
      overflow: visible;
      text-overflow: clip;
    }


    body.page-music .album-artist {
      font-size: 1.1rem;
      font-weight: 400;
      color: #666;
      margin-bottom: 1.2rem;
    }

    body.page-music .album-desc {
      font-size: 1rem;
      line-height: 1.7;
    }



    </style>
  </head>

  <body class="is-preload page-music">


    <button class="sidebar-toggle" aria-controls="sidebar" aria-expanded="false" aria-label="Toggle sidebar">
        ☰
    </button>
    <!-- Wrapper -->
    <div id="wrapper">

      <!-- Main -->
      <div id="main">
        <div class="inner">

          <header class="main">
            <h1>My LP Collections</h1>
          </header>

          <section class="lp-list" id="lpList"></section>

        </div>
      </div>

      <div id="sidebar"></div>


      <!-- Scripts -->
      <script src="assets/js/jquery.min.js"></script>
      <script src="assets/js/browser.min.js"></script>
      <script src="assets/js/breakpoints.min.js"></script>
      <script src="assets/js/util.js"></script>
      <script src="assets/js/main.js"></script>

      <!-- 사이드바 include -->
      <script src="assets/js/include.js"></script>
      <script src="assets/js/sidebar-toggle.js"></script>
      <!-- Albums -->
      <script src="assets/js/albums.js"></script>
  </body>
</html>
